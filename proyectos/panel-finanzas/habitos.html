<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<title>Hábitos</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   CALENDARIO DE HÁBITOS · iOS 18 Dark
   Archivo único: sin dependencias, sin fuentes externas, sin librerías.
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: dark;

  /* Superficies */
  --fondo: #000000;
  --cristal: rgba(28, 28, 30, 0.75);
  --cristal-2: rgba(44, 44, 46, 0.7);
  --borde: 1px solid rgba(255, 255, 255, 0.12);
  --borde-tenue: 1px solid rgba(255, 255, 255, 0.07);

  /* Texto */
  --txt: #ffffff;
  --txt-2: rgba(235, 235, 245, 0.6);
  --txt-3: rgba(235, 235, 245, 0.3);
  --gris: #8e8e93;

  /* Estados */
  --verde: #30d158;   /* cumplido */
  --rosa: #ff375f;    /* sin completar / hoy */
  --naranja: #ff9f0a; /* hábitos y badges */
  --azul: #0a84ff;    /* selección y activos */

  /* Degradado pastel para las piezas destacadas */
  --pastel: linear-gradient(115deg, #e9e7a6 0%, #cfe4cb 42%, #ccd6ea 78%, #d9d2e6 100%);

  --r: 22px;   /* squircle Apple */
  --r-s: 16px;
  --hueco: 16px;

  --sf: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
        'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, system-ui, sans-serif;

  --muelle: cubic-bezier(.32, .72, 0, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  background: var(--fondo);
  color: var(--txt);
  font-family: var(--sf);
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  padding-bottom: max(44px, env(safe-area-inset-bottom));
}

/* Halos de color muy tenues: dan aire al negro puro sin ensuciarlo. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(620px 400px at 8% -6%, rgba(255, 159, 10, 0.13), transparent 70%),
    radial-gradient(540px 360px at 96% 4%, rgba(10, 132, 255, 0.14), transparent 70%),
    radial-gradient(680px 440px at 50% 108%, rgba(48, 209, 88, 0.10), transparent 70%);
}

.envoltura { position: relative; z-index: 1; max-width: 1220px; margin: 0 auto; padding: 0 20px; }

.num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
.oculto { display: none !important; }

/* ── Navegación común de la app ─────────────────────────────────────────── */
.app-nav {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border-bottom: var(--borde-tenue);
  padding-top: env(safe-area-inset-top);
}

.app-nav-fila {
  max-width: 1220px;
  margin: 0 auto;
  padding: 9px 20px;
  display: flex;
  align-items: center;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
}

.app-nav-fila::-webkit-scrollbar { display: none; }

.app-marca { display: grid; place-items: center; width: 28px; height: 28px; color: var(--naranja); margin-right: 7px; flex: none; }
.app-marca svg { width: 20px; height: 20px; fill: none; }

.app-nav a {
  padding: 6px 13px;
  border-radius: 20px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--txt-2);
  text-decoration: none;
  white-space: nowrap;
  transition: background .18s ease, color .18s ease;
}

.app-nav a:hover { background: rgba(255, 255, 255, 0.07); color: var(--txt); }
.app-nav a[aria-current='page'] { background: rgba(255, 255, 255, 0.12); color: var(--txt); font-weight: 600; }

.app-nav-estado {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--txt-3);
  white-space: nowrap;
  padding-left: 12px;
}

@media (max-width: 560px) { .app-nav-estado { display: none; } }

/* ── Botonera base ──────────────────────────────────────────────────────── */
button {
  font: inherit;
  color: var(--txt);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  letter-spacing: -0.01em;
}

button:focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; border-radius: 12px; }

/* Botón circular de navegación (‹ ›) */
.circular {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--cristal);
  border: var(--borde);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  font-size: 19px; line-height: 1;
  color: var(--txt-2);
  transition: transform .18s var(--muelle), color .18s ease, background .18s ease;
  flex: none;
}

.circular:hover { color: var(--txt); background: var(--cristal-2); }
.circular:active { transform: scale(.9); }

/* ── Cabecera ───────────────────────────────────────────────────────────── */
.cabecera { padding: 30px 0 22px; }

.cabecera-fila { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.titulo { min-width: 0; margin-right: auto; }

.titulo p {
  margin: 0 0 2px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--naranja);
}

.titulo h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; }

.navegador { display: flex; align-items: center; gap: 10px; }
.navegador .etiqueta-mes { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; min-width: 148px; text-align: center; }

/* Selector segmentado tipo píldora */
.segmentado {
  display: inline-flex;
  gap: 3px;
  padding: 3px;
  background: rgba(120, 120, 128, 0.22);
  border-radius: 14px;
  margin-top: 18px;
}

.segmentado button {
  padding: 8px 22px;
  border-radius: 11px;
  font-size: 14px; font-weight: 500;
  color: var(--txt-2);
  transition: background .22s var(--muelle), color .18s ease;
}

.segmentado button[aria-selected='true'] {
  background: rgba(99, 99, 102, 0.9);
  color: var(--txt);
  font-weight: 600;
}

/* ── Tarjeta hero con degradado pastel ──────────────────────────────────── */
.hero {
  background: var(--pastel);
  border-radius: var(--r);
  padding: 20px 22px;
  color: #17171a;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: var(--hueco);
  box-shadow: 0 14px 40px rgba(207, 228, 203, 0.12);
}

.hero-txt { min-width: 0; flex: 1; }
.hero-txt small { display: block; font-size: 13px; font-weight: 500; opacity: .62; }
.hero-txt b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }

/* Anillo de progreso del día, dibujado con conic-gradient */
.anillo {
  --pc: 0;
  width: 76px; height: 76px;
  border-radius: 50%;
  flex: none;
  display: grid; place-items: center;
  background: conic-gradient(#17171a calc(var(--pc) * 1%), rgba(23, 23, 26, 0.16) 0);
  transition: --pc .6s var(--muelle);
}

.anillo::before {
  content: '';
  position: absolute;
  width: 60px; height: 60px;
  border-radius: 50%;
  background: #e4e5c9;
}

.anillo span { position: relative; font-size: 17px; font-weight: 700; letter-spacing: -0.03em; }

/* ── Estructura principal ───────────────────────────────────────────────── */
.tablero { display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: var(--hueco); align-items: start; }

.panel {
  background: var(--cristal);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border: var(--borde);
  border-radius: var(--r);
  padding: 18px;
  min-width: 0;
}

/* ── Vista Día: cuadrícula del mes ──────────────────────────────────────── */
.semana-cab, .rejilla {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 7px;
}

.semana-cab { margin-bottom: 9px; }

.semana-cab span {
  text-align: center;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gris);
}

.celda {
  position: relative;
  aspect-ratio: 1 / 1.06;
  min-height: 62px;
  border-radius: var(--r-s);
  border: var(--borde-tenue);
  background: rgba(255, 255, 255, 0.035);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 5px;
  padding: 8px 4px 6px;
  transition: transform .18s var(--muelle), background .18s ease, border-color .18s ease;
}

.celda:hover { background: rgba(255, 255, 255, 0.075); }
.celda:active { transform: scale(.94); }

.celda.fuera { opacity: .28; }

.celda .dia {
  width: 27px; height: 27px;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 15px; font-weight: 600;
  letter-spacing: -0.02em;
}

/* Día actual: círculo rosa neón, como el "hoy" de iOS */
.celda.hoy .dia { background: var(--rosa); color: #fff; }

/* Selección: contorno azul brillante y fondo translúcido */
.celda.elegida {
  border: 1px solid var(--azul);
  background: rgba(10, 132, 255, 0.16);
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.18), 0 6px 20px rgba(10, 132, 255, 0.2);
}

/* Ticks: un punto verde por hábito cumplido ese día */
.ticks { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; min-height: 7px; }

.tick {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--verde);
  box-shadow: 0 0 6px rgba(48, 209, 88, 0.65);
  animation: aparecer .3s var(--muelle);
}

@keyframes aparecer { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }

/* Día pasado sin ningún hábito: aro rosa muy tenue como recordatorio */
.celda.fallado::after {
  content: '';
  position: absolute;
  inset: auto 0 6px 0;
  margin: 0 auto;
  width: 6px; height: 6px;
  border-radius: 50%;
  border: 1px solid rgba(255, 55, 95, 0.55);
}

.celda.completo { background: rgba(48, 209, 88, 0.12); border-color: rgba(48, 209, 88, 0.35); }

/* ── Vistas Mes y Año ───────────────────────────────────────────────────── */
.rejilla-resumen { display: grid; gap: 12px; }
.rejilla-resumen.semanas { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.rejilla-resumen.meses { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); }

.mini {
  border: var(--borde-tenue);
  border-radius: var(--r-s);
  background: rgba(255, 255, 255, 0.04);
  padding: 15px 16px;
  transition: transform .18s var(--muelle), border-color .18s ease;
  text-align: left;
  width: 100%;
}

.mini:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.2); }

.mini.activo { border-color: var(--azul); background: rgba(10, 132, 255, 0.13); }

.mini-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.mini-cab b { font-size: 15px; font-weight: 600; letter-spacing: -0.015em; }
.mini-pct { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; }
.mini-sub { font-size: 12px; color: var(--txt-3); margin-bottom: 11px; }

/* Barra con las marcas 0 % / valor / 100 %, como en la referencia */
.escala { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--txt-3); margin-bottom: 5px; }
.escala .valor { color: var(--txt-2); font-weight: 600; }

.carril { height: 9px; border-radius: 5px; background: rgba(120, 120, 128, 0.26); overflow: hidden; }

.relleno {
  display: block; height: 100%;
  border-radius: 5px;
  background: var(--pastel);
  transition: width .7s var(--muelle);
}

.relleno.verde { background: linear-gradient(90deg, #1f8f3e, var(--verde)); box-shadow: 0 0 12px rgba(48, 209, 88, .45); }
.relleno.rosa { background: linear-gradient(90deg, #b02440, var(--rosa)); }

/* ── Panel lateral: checklist del día ───────────────────────────────────── */
.lateral { position: sticky; top: 20px; }

.lateral-cab { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.lateral-cab h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.2; flex: 1; }
.lateral-cab p { margin: 2px 0 0; font-size: 12.5px; color: var(--txt-3); }

.badge {
  font-size: 12.5px; font-weight: 700;
  padding: 5px 12px;
  border-radius: 20px;
  background: rgba(255, 159, 10, 0.18);
  color: var(--naranja);
  white-space: nowrap;
  flex: none;
}

.badge.pleno { background: rgba(48, 209, 88, 0.18); color: var(--verde); }

.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }

.habito {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 13px 14px;
  border-radius: var(--r-s);
  border: var(--borde-tenue);
  background: rgba(255, 255, 255, 0.04);
  text-align: left;
  transition: background .2s ease, border-color .2s ease, transform .16s var(--muelle);
}

.habito:hover { background: rgba(255, 255, 255, 0.075); }
.habito:active { transform: scale(.985); }

.habito[aria-pressed='true'] { background: rgba(48, 209, 88, 0.12); border-color: rgba(48, 209, 88, 0.34); }

.emoji {
  width: 36px; height: 36px;
  border-radius: 11px;
  display: grid; place-items: center;
  font-size: 18px;
  background: rgba(255, 159, 10, 0.16);
  flex: none;
}

.habito-txt { flex: 1; min-width: 0; }
.habito-txt b { display: block; font-size: 15px; font-weight: 500; letter-spacing: -0.012em; }
.habito-txt span { font-size: 12px; color: var(--txt-3); }

/* Checkbox circular */
.check {
  width: 27px; height: 27px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.28);
  display: grid; place-items: center;
  flex: none;
  transition: background .22s var(--muelle), border-color .22s ease, transform .22s var(--muelle);
}

.check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .3s var(--muelle); }

.habito[aria-pressed='true'] .check {
  background: var(--verde);
  border-color: var(--verde);
  transform: scale(1.06);
}

.habito[aria-pressed='true'] .check svg { stroke-dashoffset: 0; }

/* Estadísticas del pie del panel */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 16px; }

.stat {
  border: var(--borde-tenue);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.04);
  padding: 11px 12px;
  text-align: center;
}

.stat b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.03em; }
.stat span { font-size: 10.5px; color: var(--txt-3); letter-spacing: 0.02em; }

/* ── Leyenda ────────────────────────────────────────────────────────────── */
.leyenda { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--txt-3); }
.leyenda i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.leyenda .v { background: var(--verde); }
.leyenda .r { background: var(--rosa); }
.leyenda .a { background: var(--azul); }

.pie { padding: 24px 4px 0; font-size: 12px; color: var(--txt-3); line-height: 1.6; }
.pie button { color: var(--azul); font-size: 12.5px; }

/* ── Aviso flotante ─────────────────────────────────────────────────────── */
.brindis {
  position: fixed;
  left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
  transform: translate(-50%, 14px);
  z-index: 60;
  padding: 11px 20px;
  border-radius: 22px;
  background: rgba(44, 44, 46, 0.94);
  backdrop-filter: blur(20px);
  border: var(--borde);
  font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .3s var(--muelle);
}

.brindis.visible { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width: 1020px) {
  .tablero { grid-template-columns: 1fr; }
  .lateral { position: static; }
}

@media (max-width: 560px) {
  .envoltura { padding: 0 14px; }
  .cabecera { padding: 22px 0 18px; }
  .titulo h1 { font-size: 26px; }
  .navegador { width: 100%; justify-content: space-between; }
  .navegador .etiqueta-mes { flex: 1; min-width: 0; }
  .segmentado { display: flex; width: 100%; }
  .segmentado button { flex: 1; padding: 8px 6px; }
  .hero { padding: 16px 17px; gap: 14px; }
  .hero-txt b { font-size: 21px; }
  .anillo { width: 64px; height: 64px; }
  .anillo::before { width: 50px; height: 50px; }
  .panel { padding: 13px; }
  .celda { min-height: 50px; border-radius: 13px; padding: 6px 2px 5px; gap: 3px; }
  .celda .dia { width: 23px; height: 23px; font-size: 13px; }
  .tick { width: 5px; height: 5px; }
  .semana-cab, .rejilla { gap: 5px; }
  .stats { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<!-- Navegación común a todas las pantallas -->
<nav class="app-nav" aria-label="Secciones">
  <div class="app-nav-fila">
    <a href="inicio.html" class="app-marca" aria-label="Inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></g></svg>
    </a>
    <a href="inicio.html">Inicio</a>
    <a href="index.html">Finanzas</a>
    <a href="habitos.html" aria-current="page">Hábitos</a>
    <a href="index.html#objetivos">Objetivos</a>
    <span class="app-nav-estado" id="origenDatos">…</span>
  </div>
</nav>

<main class="envoltura">

  <!-- ══ A. Cabecera, navegador de fechas y selector de vistas ══════════════ -->
  <header class="cabecera">
    <div class="cabecera-fila">
      <div class="titulo">
        <p>Seguimiento</p>
        <h1>Mis hábitos</h1>
      </div>

      <nav class="navegador" aria-label="Navegación de fechas">
        <button class="circular" id="anterior" aria-label="Periodo anterior">‹</button>
        <span class="etiqueta-mes num" id="etiquetaPeriodo" aria-live="polite"></span>
        <button class="circular" id="siguiente" aria-label="Periodo siguiente">›</button>
      </nav>
    </div>

    <div class="segmentado" role="tablist" aria-label="Modo de vista">
      <button role="tab" data-vista="dia" aria-selected="true">Día</button>
      <button role="tab" data-vista="mes" aria-selected="false">Mes</button>
      <button role="tab" data-vista="anio" aria-selected="false">Año</button>
    </div>
  </header>

  <!-- Resumen destacado del periodo visible -->
  <section class="hero" id="hero" aria-live="polite">
    <div class="hero-txt">
      <small id="heroEtq">Cumplimiento del mes</small>
      <b id="heroValor">0 %</b>
      <small id="heroDetalle"></small>
    </div>
    <div class="anillo" id="anillo"><span id="anilloPct">0%</span></div>
  </section>

  <div class="tablero">

    <!-- ══ B/D. Calendario y vistas resumen ═══════════════════════════════ -->
    <section class="panel" aria-label="Calendario">
      <!-- Vista Día -->
      <div id="vistaDia">
        <div class="semana-cab" aria-hidden="true">
          <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
        </div>
        <div class="rejilla" id="rejilla" role="grid"></div>
        <div class="leyenda">
          <span><i class="v"></i>Hábito cumplido</span>
          <span><i class="r"></i>Hoy · día sin registrar</span>
          <span><i class="a"></i>Día seleccionado</span>
        </div>
      </div>

      <!-- Vista Mes -->
      <div id="vistaMes" class="oculto">
        <div class="rejilla-resumen semanas" id="rejillaSemanas"></div>
      </div>

      <!-- Vista Año -->
      <div id="vistaAnio" class="oculto">
        <div class="rejilla-resumen meses" id="rejillaMeses"></div>
      </div>
    </section>

    <!-- ══ C. Checklist del día seleccionado ══════════════════════════════ -->
    <aside class="panel lateral" aria-label="Registro del día">
      <div class="lateral-cab">
        <div style="flex:1; min-width:0">
          <h2 id="fechaElegida">—</h2>
          <p id="subFecha"></p>
        </div>
        <span class="badge" id="ratio">0/4 Hecho</span>
      </div>

      <ul class="lista" id="listaHabitos"></ul>

      <div class="stats">
        <div class="stat"><b class="num" id="statRacha">0</b><span>RACHA</span></div>
        <div class="stat"><b class="num" id="statMes">0 %</b><span>ESTE MES</span></div>
        <div class="stat"><b class="num" id="statPerfectos">0</b><span>DÍAS PLENOS</span></div>
      </div>
    </aside>
  </div>

  <p class="pie">
    <span id="pieTexto"></span>
    <button id="btnHoy">Ir a hoy</button> ·
    <button id="btnVaciar">Borrar todo el historial</button>
  </p>
</main>

<div class="brindis" id="brindis" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];

  const CLAVE = 'habitos:v1';

  // ── Definición de hábitos ────────────────────────────────────────────────
  const HABITOS = [
    { id: 'gym',      emoji: '🏋️‍♂️', nombre: 'Gimnasio y salud',   pista: 'Entrenar hoy' },
    { id: 'lectura',  emoji: '📚',   nombre: 'Lectura diaria',     pista: 'Desarrollo personal' },
    { id: 'negocio',  emoji: '💻',   nombre: 'Avance del proyecto', pista: 'Emprendimiento' },
    { id: 'carrera',  emoji: '🏃‍♂️', nombre: 'Carrera o deporte',  pista: 'Salir a correr' },
  ];

  const TOTAL = HABITOS.length;

  const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const MESES_CORTO = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

  // ── Utilidades de fecha ──────────────────────────────────────────────────
  // Van antes que el estado: éste las necesita para arrancar.
  const dosDig = (n) => String(n).padStart(2, '0');
  const claveDe = (d) => `${d.getFullYear()}-${dosDig(d.getMonth() + 1)}-${dosDig(d.getDate())}`;
  const desdeClave = (k) => { const [a, m, d] = k.split('-').map(Number); return new Date(a, m - 1, d); };

  const diasEnMes = (a, m) => new Date(a, m + 1, 0).getDate();
  const esFutura = (k) => desdeClave(k) > new Date(new Date().setHours(23, 59, 59, 999));

  const HOY = claveDe(new Date());

  // ── Estado ───────────────────────────────────────────────────────────────
  // registro = { 'aaaa-mm-dd': ['gym', 'lectura'] }
  let registro = cargar();
  let vista = 'dia';
  let cursor = new Date();                // mes/año que se está mirando
  let elegido = HOY;                      // día seleccionado

  // Si hay servidor detrás, los hábitos viven en el Excel como el resto de datos.
  // Si el archivo se abre suelto, se guardan en este navegador.
  let enExcel = false;

  function cargar() {
    try {
      const crudo = localStorage.getItem(CLAVE);
      return crudo ? JSON.parse(crudo) : {};
    } catch {
      return {};
    }
  }

  async function cargarDelExcel() {
    try {
      const r = await fetch('/api/habitos');
      if (!r.ok) return false;
      registro = await r.json();
      enExcel = true;
      return true;
    } catch {
      return false;
    }
  }

  function guardar() {
    if (enExcel) {
      fetch('/api/habitos', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fecha: elegido, hechos: hechosDe(elegido) }),
      })
        .then((r) => (r.ok ? null : r.json().then((c) => avisar(c.error || 'No he podido guardar'))))
        .catch(() => avisar('Sin conexión con el panel: no se ha guardado'));
      return;
    }
    try {
      localStorage.setItem(CLAVE, JSON.stringify(registro));
    } catch {
      avisar('No he podido guardar en este navegador');
    }
  }

  const hechosDe = (k) => registro[k] || [];

  // ── Métricas ─────────────────────────────────────────────────────────────
  /** Porcentaje medio de cumplimiento de un mes, contando solo días ya vividos. */
  function porcentajeMes(anio, mes) {
    const total = diasEnMes(anio, mes);
    let dias = 0, suma = 0;
    for (let d = 1; d <= total; d++) {
      const k = `${anio}-${dosDig(mes + 1)}-${dosDig(d)}`;
      if (esFutura(k)) break;
      dias++;
      suma += hechosDe(k).length / TOTAL;
    }
    return dias ? suma / dias : 0;
  }

  /** Igual, pero acotado a un rango de días dentro del mes (para las semanas). */
  function porcentajeRango(anio, mes, desde, hasta) {
    let dias = 0, suma = 0;
    for (let d = desde; d <= hasta; d++) {
      const k = `${anio}-${dosDig(mes + 1)}-${dosDig(d)}`;
      if (esFutura(k)) break;
      dias++;
      suma += hechosDe(k).length / TOTAL;
    }
    return { pct: dias ? suma / dias : 0, dias };
  }

  /** Días consecutivos hasta hoy con al menos un hábito hecho. */
  function racha() {
    let n = 0;
    const d = new Date();
    // Si hoy aún no hay nada, la racha se mide desde ayer: el día no ha acabado.
    if (!hechosDe(claveDe(d)).length) d.setDate(d.getDate() - 1);
    while (hechosDe(claveDe(d)).length) {
      n++;
      d.setDate(d.getDate() - 1);
    }
    return n;
  }

  function diasPlenos(anio, mes) {
    const total = diasEnMes(anio, mes);
    let n = 0;
    for (let d = 1; d <= total; d++) {
      if (hechosDe(`${anio}-${dosDig(mes + 1)}-${dosDig(d)}`).length === TOTAL) n++;
    }
    return n;
  }

  const pct = (n) => Math.round(n * 100) + ' %';

  // ── Aviso flotante ───────────────────────────────────────────────────────
  let reloj;
  function avisar(texto) {
    const el = $('#brindis');
    el.textContent = texto;
    el.classList.add('visible');
    clearTimeout(reloj);
    reloj = setTimeout(() => el.classList.remove('visible'), 2400);
  }

  // ── B. Cuadrícula del mes ────────────────────────────────────────────────
  function pintarRejilla() {
    const anio = cursor.getFullYear();
    const mes = cursor.getMonth();

    // La semana empieza en lunes: getDay() da 0 para domingo.
    const desplazamiento = (new Date(anio, mes, 1).getDay() + 6) % 7;
    const total = diasEnMes(anio, mes);
    const celdas = Math.ceil((desplazamiento + total) / 7) * 7;

    let html = '';
    for (let i = 0; i < celdas; i++) {
      const fecha = new Date(anio, mes, 1 - desplazamiento + i);
      const k = claveDe(fecha);
      const fuera = fecha.getMonth() !== mes;
      const hechos = hechosDe(k).length;
      const pasado = !esFutura(k) && k !== HOY;

      const clases = [
        'celda',
        fuera ? 'fuera' : '',
        k === HOY ? 'hoy' : '',
        k === elegido ? 'elegida' : '',
        hechos === TOTAL ? 'completo' : '',
        !fuera && pasado && hechos === 0 ? 'fallado' : '',
      ].filter(Boolean).join(' ');

      html += `<button class="${clases}" data-fecha="${k}" role="gridcell"
        aria-label="${fecha.getDate()} de ${MESES[fecha.getMonth()]}, ${hechos} de ${TOTAL} hábitos"
        aria-selected="${k === elegido}">
        <span class="dia num">${fecha.getDate()}</span>
        <span class="ticks">${'<i class="tick"></i>'.repeat(hechos)}</span>
      </button>`;
    }

    $('#rejilla').innerHTML = html;
  }

  // ── D. Vista Mes: una tarjeta por semana ─────────────────────────────────
  function pintarSemanas() {
    const anio = cursor.getFullYear();
    const mes = cursor.getMonth();
    const total = diasEnMes(anio, mes);

    let html = '';
    let semana = 1;
    for (let desde = 1; desde <= total; desde += 7, semana++) {
      const hasta = Math.min(desde + 6, total);
      const { pct: p, dias } = porcentajeRango(anio, mes, desde, hasta);
      const tono = p >= 0.75 ? 'verde' : p < 0.35 ? 'rosa' : '';

      html += `<article class="mini">
        <div class="mini-cab"><b>Semana ${semana}</b><span class="mini-pct num">${pct(p)}</span></div>
        <div class="mini-sub num">${desde}–${hasta} de ${MESES[mes]} · ${dias || 0} día(s) contados</div>
        <div class="escala"><span>0%</span><span class="valor num">${pct(p)}</span><span>100%</span></div>
        <div class="carril"><span class="relleno ${tono}" style="width:${(p * 100).toFixed(1)}%"></span></div>
      </article>`;
    }

    $('#rejillaSemanas').innerHTML = html;
  }

  // ── D. Vista Año: doce tarjetas ──────────────────────────────────────────
  function pintarMeses() {
    const anio = cursor.getFullYear();
    const hoyReal = new Date();

    $('#rejillaMeses').innerHTML = MESES.map((nombre, m) => {
      const p = porcentajeMes(anio, m);
      const activo = m === cursor.getMonth();
      const futuro = anio > hoyReal.getFullYear() || (anio === hoyReal.getFullYear() && m > hoyReal.getMonth());
      const tono = p >= 0.75 ? 'verde' : p < 0.35 ? 'rosa' : '';

      return `<button class="mini ${activo ? 'activo' : ''}" data-mes="${m}">
        <div class="mini-cab"><b>${nombre}</b><span class="mini-pct num">${futuro ? '—' : pct(p)}</span></div>
        <div class="mini-sub">${futuro ? 'aún por vivir' : `${diasPlenos(anio, m)} día(s) plenos`}</div>
        <div class="carril"><span class="relleno ${tono}" style="width:${futuro ? 0 : (p * 100).toFixed(1)}%"></span></div>
      </button>`;
    }).join('');
  }

  // ── C. Checklist del día elegido ─────────────────────────────────────────
  function pintarChecklist() {
    const fecha = desdeClave(elegido);
    const hechos = hechosDe(elegido);

    $('#fechaElegida').textContent = fecha.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })
      .replace(/^./, (c) => c.toUpperCase());

    $('#subFecha').textContent = elegido === HOY ? 'Hoy' : esFutura(elegido) ? 'Todavía no ha llegado' : fecha.getFullYear();

    const ratio = $('#ratio');
    ratio.textContent = `${hechos.length}/${TOTAL} Hecho`;
    ratio.classList.toggle('pleno', hechos.length === TOTAL);

    $('#listaHabitos').innerHTML = HABITOS.map((h) => {
      const marcado = hechos.includes(h.id);
      return `<li>
        <button class="habito" data-habito="${h.id}" aria-pressed="${marcado}">
          <span class="emoji" aria-hidden="true">${h.emoji}</span>
          <span class="habito-txt"><b>${h.nombre}</b><span>${h.pista}</span></span>
          <span class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
        </button>
      </li>`;
    }).join('');

    // Estadísticas del pie
    $('#statRacha').textContent = racha();
    $('#statMes').textContent = pct(porcentajeMes(cursor.getFullYear(), cursor.getMonth()));
    $('#statPerfectos').textContent = diasPlenos(cursor.getFullYear(), cursor.getMonth());
  }

  // ── Tarjeta hero: cambia según la vista activa ───────────────────────────
  function pintarHero() {
    const anio = cursor.getFullYear();
    const mes = cursor.getMonth();
    let p, etq, detalle;

    if (vista === 'anio') {
      const meses = MESES.map((_, m) => porcentajeMes(anio, m)).filter((_, m) => !(anio > new Date().getFullYear() || (anio === new Date().getFullYear() && m > new Date().getMonth())));
      p = meses.length ? meses.reduce((a, b) => a + b, 0) / meses.length : 0;
      etq = `Cumplimiento de ${anio}`;
      detalle = `${meses.length} mes(es) contados`;
    } else if (vista === 'mes') {
      p = porcentajeMes(anio, mes);
      etq = `Cumplimiento de ${MESES[mes]}`;
      detalle = `${diasPlenos(anio, mes)} día(s) con los ${TOTAL} hábitos`;
    } else {
      const hechos = hechosDe(elegido).length;
      p = hechos / TOTAL;
      etq = elegido === HOY ? 'Tu día de hoy' : 'Día seleccionado';
      detalle = `${hechos} de ${TOTAL} hábitos · racha de ${racha()} día(s)`;
    }

    $('#heroEtq').textContent = etq;
    $('#heroValor').textContent = pct(p);
    $('#heroDetalle').textContent = detalle;
    $('#anillo').style.setProperty('--pc', (p * 100).toFixed(0));
    $('#anilloPct').textContent = Math.round(p * 100) + '%';
  }

  // ── Repintado global ─────────────────────────────────────────────────────
  function pintar() {
    const anio = cursor.getFullYear();

    // Etiqueta del navegador y qué vista se muestra
    $('#etiquetaPeriodo').textContent = vista === 'anio' ? String(anio) : `${MESES[cursor.getMonth()]} ${anio}`;
    $('#vistaDia').classList.toggle('oculto', vista !== 'dia');
    $('#vistaMes').classList.toggle('oculto', vista !== 'mes');
    $('#vistaAnio').classList.toggle('oculto', vista !== 'anio');

    if (vista === 'dia') pintarRejilla();
    else if (vista === 'mes') pintarSemanas();
    else pintarMeses();

    pintarChecklist();
    pintarHero();

    const registrados = Object.keys(registro).filter((k) => registro[k].length).length;
    $('#pieTexto').textContent = `${registrados} día(s) con registro, guardados solo en este navegador. `;
  }

  // ── Interacción ──────────────────────────────────────────────────────────
  // Cambio de vista
  $$('.segmentado button').forEach((b) =>
    b.addEventListener('click', () => {
      vista = b.dataset.vista;
      $$('.segmentado button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
      pintar();
    })
  );

  // Navegación de periodo: meses en Día/Mes, años en Año
  const mover = (paso) => {
    if (vista === 'anio') cursor = new Date(cursor.getFullYear() + paso, cursor.getMonth(), 1);
    else cursor = new Date(cursor.getFullYear(), cursor.getMonth() + paso, 1);
    pintar();
  };

  $('#anterior').addEventListener('click', () => mover(-1));
  $('#siguiente').addEventListener('click', () => mover(1));

  // Selección de día
  $('#rejilla').addEventListener('click', (e) => {
    const celda = e.target.closest('.celda');
    if (!celda) return;
    elegido = celda.dataset.fecha;
    // Si se pincha un día del mes vecino, el calendario salta a ese mes.
    const f = desdeClave(elegido);
    if (f.getMonth() !== cursor.getMonth()) cursor = new Date(f.getFullYear(), f.getMonth(), 1);
    pintar();
  });

  // Marcar y desmarcar hábitos
  $('#listaHabitos').addEventListener('click', (e) => {
    const boton = e.target.closest('.habito');
    if (!boton) return;

    if (esFutura(elegido)) {
      avisar('Ese día todavía no ha llegado');
      return;
    }

    const id = boton.dataset.habito;
    const hechos = new Set(hechosDe(elegido));
    hechos.has(id) ? hechos.delete(id) : hechos.add(id);

    if (hechos.size) registro[elegido] = [...hechos];
    else delete registro[elegido];

    guardar();
    pintar();

    if (hechos.size === TOTAL) avisar('¡Día completo!');
  });

  // Salto de mes desde la vista Año
  $('#rejillaMeses').addEventListener('click', (e) => {
    const tarjeta = e.target.closest('[data-mes]');
    if (!tarjeta) return;
    cursor = new Date(cursor.getFullYear(), Number(tarjeta.dataset.mes), 1);
    vista = 'dia';
    $$('.segmentado button').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.vista === 'dia')));
    pintar();
  });

  // Volver a hoy
  $('#btnHoy').addEventListener('click', () => {
    cursor = new Date();
    elegido = HOY;
    pintar();
    avisar('Hoy');
  });

  // Vaciar historial
  $('#btnVaciar').addEventListener('click', async () => {
    const donde = enExcel ? 'del Excel' : 'de este navegador';
    if (!confirm(`Esto borra todo el historial de hábitos ${donde}. ¿Seguir?`)) return;

    if (enExcel) {
      // Un día por petición: son pocos y así el Excel queda compactado.
      for (const fecha of Object.keys(registro)) {
        await fetch('/api/habitos', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fecha, hechos: [] }),
        }).catch(() => {});
      }
      registro = {};
    } else {
      registro = {};
      guardar();
    }

    pintar();
    avisar('Historial borrado');
  });

  // Teclado: flechas mueven el día, espacio marca el primer hábito pendiente
  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;

    const saltos = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
    if (vista === 'dia' && saltos[e.key]) {
      e.preventDefault();
      const f = desdeClave(elegido);
      f.setDate(f.getDate() + saltos[e.key]);
      elegido = claveDe(f);
      if (f.getMonth() !== cursor.getMonth()) cursor = new Date(f.getFullYear(), f.getMonth(), 1);
      pintar();
    }
  });

  // Arranque: primero se intenta el Excel; si no hay servidor, el navegador.
  pintar();
  cargarDelExcel().then((ok) => {
    if (ok) {
      pintar();
      $('#origenDatos').textContent = 'Sincronizado con tu Excel';
    } else {
      $('#origenDatos').textContent = 'Guardado en este navegador';
    }
  });
})();
</script>
</body>
</html>
