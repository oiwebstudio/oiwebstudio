# Compila el APK de "Mi panel" en los servidores de GitHub.
# Así no hace falta instalar Android Studio ni el SDK en tu ordenador:
# el runner ya los trae puestos.
#
# Se lanza a mano desde la pestaña Actions del repositorio, o solo cuando
# cambia algo dentro de proyectos/mi-panel-movil.

name: APK — Mi panel

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    paths:
      - 'proyectos/mi-panel-movil/**'
      - '.github/workflows/apk.yml'

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyectos/mi-panel-movil

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      # Capacitor 8 compila sus fuentes con nivel de lenguaje 21: con Java 17
      # falla en :capacitor-android con "invalid source release: 21".
      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          # Los que pide el proyecto: si Gradle tuviera que bajarlos por su
          # cuenta, fallaría por licencias sin aceptar.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Deja constancia de con qué se está compilando: si algo falla, el log
      # dice si el problema es la versión de Java, Node o el SDK.
      # Si Java no es 21, no tiene sentido seguir: se para aquí con un mensaje
      # claro en vez de morir 40 s después dentro de Gradle.
      - name: Comprobar el entorno
        run: |
          echo "Node:      $(node -v)"
          echo "npm:       $(npm -v)"
          echo "Java:      $(java -version 2>&1 | head -1)"
          echo "JAVA_HOME: $JAVA_HOME"
          echo "SDK:       ${ANDROID_HOME:-sin definir}"

          VERSION=$(java -version 2>&1 | head -1 | grep -oE '"[0-9]+' | tr -d '"')
          if [ "$VERSION" -lt 21 ]; then
            echo "::error::Capacitor 8 necesita Java 21 y aquí hay Java $VERSION."
            exit 1
          fi
          echo "Java $VERSION: correcto."

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la web dentro del proyecto Android
        run: npx cap sync android

      # Windows no guarda el bit de ejecución, así que gradlew puede llegar aquí
      # sin permisos. Se los damos por si acaso: si ya los tiene, no hace nada.
      - name: Dar permisos a gradlew
        run: chmod +x gradlew
        working-directory: proyectos/mi-panel-movil/android

      # -Dorg.gradle.java.home fuerza el JDK: sin esto Gradle puede elegir otro
      # de los que trae la máquina y volver al "invalid source release: 21".
      - name: Compilar el APK
        run: |
          ./gradlew -version
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"
        working-directory: proyectos/mi-panel-movil/android

      # Si Gradle falla, el motivo real queda enterrado entre cientos de líneas
      # de rastro. Esto deja a mano solo lo que importa.
      - name: Qué ha fallado
        if: failure()
        run: |
          echo "════════ MOTIVO DEL FALLO ════════"
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 \
            | grep -A 25 "FAILURE: Build failed" \
            | grep -v "^\s*at org.gradle" || echo "(sin bloque FAILURE)"
        working-directory: proyectos/mi-panel-movil/android
        continue-on-error: true

      - name: Guardar los informes de Gradle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-gradle
          path: |
            proyectos/mi-panel-movil/android/app/build/reports/
            proyectos/mi-panel-movil/android/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: mi-panel-apk
          path: proyectos/mi-panel-movil/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
