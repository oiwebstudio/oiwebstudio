<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, follow"/>
<title>Demos — OI Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.container{max-width:1000px;width:100%;}
h1{text-align:center;color:#fff;margin-bottom:50px;font-size:clamp(28px,6vw,48px);letter-spacing:-1px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;}
a{text-decoration:none;display:flex;align-items:center;justify-content:center;padding:clamp(24px,5vw,40px);border-radius:12px;font-size:clamp(16px,4vw,18px);font-weight:600;transition:all .3s ease;box-shadow:0 4px 15px rgba(0,0,0,.3);color:#fff;min-height:120px;}
a:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(0,0,0,.4);}
.errotatxo{background:linear-gradient(135deg,#d1a674 0%,#8a5a2f 100%);}
</style>
</head>
<body>
<div class="container">
<h1>Demos</h1>
<div class="grid">
<a href="errotatxo/" class="errotatxo">🍞 Errotatxo Tolosa</a>
</div>
</div>
</body>
</html>
